# Build the standalone parlay model and publish it to GitHub Pages.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
# Optional: add an ODDS_API_KEY repository secret for real odds. Without it the
# build uses the bundled sample slate, so the site still works.
name: Publish parlay model

on:
  push:
    # Include the working branch as well as main: GitHub runs scheduled and
    # manual workflows from the default branch only, whatever it is called.
    branches: [main, "claude/**"]
    paths:
      - "src/**"
      - "config/**"
      - "scripts/build_static.py"
      # build_slate lives here and the static build is built entirely on it, so
      # a change to it has to republish. Left out, a pipeline fix shipped to the
      # tests and never to the page.
      - "run_pipeline.py"
      - "data/mock/**"
      # A retrain writes this; republish so the page prices with it.
      - "data/calibration.json"
      - ".github/workflows/pages.yml"
  schedule:
    # 13:00 and 21:00 UTC. Each live run spends Odds API credits, per sport:
    # 3 + games x 6, so ~27 per sport at --max-events 4. Two sports, twice a
    # day, is roughly 1,600 credits a month -- over the free tier's 500. Drop a
    # sport, lower --max-events, or cut to one run a day if that matters. The
    # client refuses to spend below 50 remaining, so running out skips the
    # sport rather than breaking the build. See docs/DEPLOYMENT.md.
    - cron: "0 13,21 * * *"
  workflow_dispatch:
    inputs:
      sports:
        description: "Sports to build (space separated)"
        required: false
        default: "nfl ncaaf"
      max_events:
        description: "Games to pull player props for (blank = all)"
        required: false
        default: "4"

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publishes race; let a newer one win.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the engine
        run: pip install -e '.[stats]'

      - name: Build the site
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          MAX_EVENTS: ${{ github.event.inputs.max_events || '4' }}
          # NBA is left out on purpose: stats.nba.com refuses datacenter IPs, so
          # nba_api times out on a hosted runner. It has to be built from a
          # machine on a residential connection. The page says so on its button.
          SPORTS: ${{ github.event.inputs.sports || 'nfl ncaaf' }}
        run: |
          # --live falls back to the cached fixtures when no key is set, so
          # this one command works with or without the secret. A sport that is
          # out of season or whose stats host refuses the runner is skipped;
          # the build only fails if nothing at all could be produced.
          set -o pipefail
          python scripts/build_static.py --live --sports $SPORTS \
            --max-events "$MAX_EVENTS" 2>&1 | tee build.log

      - name: Report what was built
        if: always()
        run: |
          # In the run summary as well as the log: the logs API only serves the
          # tail, and what the model knew is near the top of a build's output.
          {
            echo '## Build'
            echo
            echo '```'
            cat build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "=== what the model knew ==="
          grep -E "^  (nfl|ncaaf|nba):|^      (yes|NO )|^Skipped:" build.log || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
