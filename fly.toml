# Fly.io deployment. Create the app and volume first:
#   fly launch --no-deploy --name parlay-crafter
#   fly volumes create parlay_data --size 1 --region iad
#   fly secrets set WEB_ACCESS_TOKEN=... ODDS_API_KEY=... ANTHROPIC_API_KEY=...
#   fly deploy
app = "parlay-crafter"
primary_region = "iad"

[build]

[env]
  DB_PATH = "/data/sports_data.db"

[http_service]
  internal_port = 8000
  force_https = true
  # One machine only: the slate cache is in-process and SQLite wants one writer.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[mounts]]
  source = "parlay_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
