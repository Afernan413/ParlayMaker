[project]
name = "parlay-engine"
version = "0.1.0"
description = "Automated FanDuel NFL/NBA parlay research pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "pandas>=1.5",
    "scipy>=1.11",
    "pulp>=2.8",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Domain feeds. Kept optional because they pin older numpy/pandas and are
# never touched by the unit tests (all network calls are mocked).
stats = [
    "nfl_data_py>=0.3.2",
    "nba_api>=1.4",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
parlay-engine = "run_pipeline:main"
parlay-web = "src.web.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["run_pipeline"]

[tool.setuptools.packages.find]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
